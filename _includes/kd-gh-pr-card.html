<div class="kd-gh-card">
  <div class="kd-gh-toprow">
    <img class="kd-gh-avatar" src="https://avatars.githubusercontent.com/u/{{ include.avatar_id }}?v=4" alt="{{ include.author }} avatar">
    <div class="kd-gh-grow">
      <div class="kd-gh-byline"><strong>{{ include.author }}</strong> merged {{ include.commits }} commits into <code class="kd-gh-branch">{{ include.base }}</code> from <code class="kd-gh-branch">{{ include.head }}</code> &middot; {{ include.when }}</div>
    </div>
    <span class="kd-gh-badge"><i class="fas fa-code-branch"></i> Merged</span>
  </div>
  <div class="kd-gh-title"><a href="{{ include.url }}">{{ include.title }} <span class="kd-gh-num">#{{ include.num }}</span></a></div>
  <div class="kd-gh-diffstat">
    <span>{{ include.files }} files changed</span>
    <span><span class="kd-gh-add">+{{ include.add }}</span> <span class="kd-gh-del">&minus;{{ include.del }}</span></span>
    <span><span class="kd-gh-sq kd-gh-sq-add"></span><span class="kd-gh-sq kd-gh-sq-add"></span><span class="kd-gh-sq kd-gh-sq-add"></span><span class="kd-gh-sq kd-gh-sq-add"></span><span class="kd-gh-sq kd-gh-sq-del"></span></span>
  </div>
  <p class="kd-gh-body">{{ include.gh_body }}</p>
</div>
